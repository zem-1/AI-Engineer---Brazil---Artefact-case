services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: emporio
      POSTGRES_USER: empordb
      POSTGRES_PASSWORD: empordb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empordb -d emporio"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
