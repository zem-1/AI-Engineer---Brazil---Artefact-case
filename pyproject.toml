[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-support-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "openai>=1.0"]
postgres = ["psycopg[binary]>=3.2", "pypdf>=5.0", "sentence-transformers>=3.0"]

[tool.setuptools]
packages = ["app"]
